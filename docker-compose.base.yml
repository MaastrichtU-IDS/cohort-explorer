# Base docker-compose file used by the dev and prod environments
services:

  backend:
    build:
      context: ./backend
      # The RUN steps of the build (apt-get, uv sync, npm i) run in the host's
      # network namespace and so use the host's resolver. Containers on Docker's
      # default bridge network cannot reach any nameserver on the deploy host
      # (nslookup in a plain container times out while the host resolves), which
      # made every image build fail on "Temporary failure resolving". Affects
      # the build only, not how the containers run.
      network: host
    environment:
      FRONTEND_URL: http://localhost:3001
      SPARQL_ENDPOINT: "http://db:7878"
      DATA_FOLDER: /data
      # A worker killed by a native crash (segfault in torch/faiss/qdrant) prints
      # the Python stack of every thread before dying instead of just
      # "Child process died".
      PYTHONFAULTHANDLER: "1"
    volumes:
      - ./data:/data
 #     - /data/deploy-services/cohort-explorer/cohortVarLinker/data/:/app/CohortVarLinker/data/
 #     - /data/deploy-services/cohort-explorer/cohortVarLinker/data/:/app/CohortVarLinker/mapping_output
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3000
    env_file:
      - .env
    volumes:
      - ./data:/data

  db:
    image: oxigraph/oxigraph:latest
    # image: oxigraph/oxigraph:0.4.0-alpha.3
    volumes:
      - ./data/db:/data
    environment:
      - RUST_LOG=info
      # Increase Oxigraph's query timeout and memory limits
      - OXIGRAPH_QUERY_TIMEOUT=300
